openapi: 3.0.3
info:
  title: firma-electronica-service
  version: 0.2.0
  description: |
    Contrato M0 (borrador). Autenticación del host: cabecera `X-Api-Key`.
    Los endpoints `/v1/sign/*` son públicos y se protegen con el token del link + OTP.
    Una solicitud de firma (`signature request`) es de un `documentType`; la plantilla activa del
    tenant para ese tipo define el contenido, el formulario y la política de evidencia.
servers:
  - url: http://localhost:4000
paths:
  /v1/requests:
    post:
      summary: Crear una solicitud de firma
      security: [{ apiKey: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
          description: |
            Entre 1 y 255 caracteres imprimibles, sin espacios; única por tenant. Repetir la
            petición con la misma clave y el mismo cuerpo devuelve la misma solicitud (y el mismo
            `signUrl`) con 200. La misma clave con otro cuerpo da 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }
        '200':
          description: La solicitud ya existía (repetición con la misma Idempotency-Key y cuerpo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }
        '401': { description: "Clave de API ausente o inválida (code INVALID_API_KEY)" }
        '409': { description: "Idempotency-Key reutilizada con un cuerpo distinto (code IDEMPOTENCY_KEY_REUSED)" }
        '422':
          description: |
            Petición inválida. El cuerpo trae `code` y, si aplica, `issues` por campo. Códigos:
            VALIDATION_ERROR, DOCUMENT_TYPE_UNSUPPORTED, TEMPLATE_NOT_FOUND, OTP_REQUIRED,
            INVALID_CONTACT, INVALID_DELIVERY, INVALID_WEBHOOK_URL, INVALID_IDEMPOTENCY_KEY y
            CHANNEL_NOT_AVAILABLE (SMS/WhatsApp y delivery.mode=SERVICE aún sin proveedor).
  /v1/requests/{id}:
    get:
      summary: Consultar el estado de una solicitud
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }
  /v1/requests/{id}/revoke:
    post:
      summary: Revocar una solicitud pendiente
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Revocada }
        '409': { description: La solicitud ya no está pendiente }
  /v1/requests/{id}/document:
    get:
      summary: PDF firmado (bytes)
      description: Solo si la solicitud está firmada (409 NOT_SIGNED si no). 404 si es de otro tenant.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409': { description: La solicitud todavía no está firmada }
  /v1/requests/{id}/photo:
    get:
      summary: Fotografía de verificación (bytes), para la revisión humana
      description: Dato sensible. 404 PHOTO_NOT_FOUND si el tipo no exigió foto; 404 si es de otro tenant.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: La imagen (image/jpeg o image/png)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /v1/sign/{token}:
    get:
      summary: Qué ve el firmante ANTES de verificar su código
      description: Solo lo mínimo; nada del contenido ni de los datos del firmante.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference: { type: string }
                  documentType: { type: string }
                  issuer: { type: object, properties: { name: { type: string } } }
                  otpRequired: { type: boolean }
                  otpTo: { type: string, nullable: true, description: Correo enmascarado (a**@dominio). }
                  expiresAt: { type: string, format: date-time }
        '404': { description: LINK_NOT_FOUND }
        '410': { description: ALREADY_SIGNED, LINK_REVOKED o LINK_EXPIRED }
  /v1/sign/{token}/otp:
    post:
      summary: Pedir el envío del OTP al contacto de la solicitud
      description: |
        Solo si la política del tipo exige OTP. Un código nuevo reemplaza al anterior.
        Enfriamiento de 60 s y tope de 5 envíos por hora por solicitud.
      responses:
        '200':
          description: Enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  sentTo: { type: string }
                  cooldownSeconds: { type: integer }
                  devCode: { type: string, description: Solo con ALLOW_DEV_OTP y sin correo configurado. }
        '409': { description: OTP_NOT_REQUIRED o MAIL_NOT_CONFIGURED }
        '429': { description: OTP_COOLDOWN (con retryAfterSeconds) u OTP_RATE_LIMITED }
        '502': { description: MAIL_SEND_FAILED (el detalle técnico NO se muestra al firmante) }
  /v1/sign/{token}/verify:
    post:
      summary: Verificar el OTP y abrir la sesión de firma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, pattern: '^[0-9]{6}$' } }
      responses:
        '200':
          description: Devuelve el documento para mostrar y un token de sesión corto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningView' }
        '401': { description: OTP_INVALID (con attemptsLeft), OTP_EXPIRED u OTP_NOT_REQUESTED }
        '429': { description: OTP_LOCKED tras 5 intentos; hay que pedir un código nuevo }
  /v1/sign/{token}/view:
    get:
      summary: Reabrir el documento con una sesión ya verificada (recarga de página)
      parameters:
        - { in: header, name: X-Session, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningView' }
        '401': { description: SESSION_INVALID }
  /v1/sign/{token}/document:
    get:
      summary: Copia firmada para el firmante (con su sesión)
      parameters:
        - { in: header, name: X-Session, required: true, schema: { type: string } }
      responses:
        '200':
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409': { description: NOT_SIGNED }
  /v1/sign/{token}/photo-challenge:
    post:
      summary: Emitir un código aleatorio para la foto (invalida el anterior)
      description: |
        Solo si la política del tipo exige desafío de foto. Requiere sesión verificada. El
        firmante escribe el código en un papel y se fotografía con el papel y su documento.
        Vence a los 10 minutos.
      responses:
        '200':
          description: Código emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string, format: uuid }
                  code: { type: string, example: '4821' }
                  expiresAt: { type: string, format: date-time }
        '429': { description: Demasiados códigos pedidos }
  /v1/sign/{token}/submit:
    post:
      summary: Firmar
      description: |
        `photo` y `challengeId` son obligatorios solo si la política del tipo lo exige.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [accepted]
              properties:
                photo: { type: string, format: binary }
                challengeId:
                  type: string
                  format: uuid
                  description: Debe ser el desafío vivo y no estar vencido al recibir la foto.
                accepted: { type: boolean }
                form:
                  type: string
                  description: JSON con lo que el firmante marcó o escribió (carta de nombramiento, facultades y observación).
                clientInfo:
                  type: string
                  description: JSON con zona horaria y datos del navegador.
      parameters:
        - { in: header, name: X-Session, required: true, schema: { type: string } }
      responses:
        '200':
          description: Firmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference: { type: string }
                  signedAt: { type: string, format: date-time }
                  pdfSha256: { type: string }
                  emailed: { type: boolean, description: true solo si el servicio SÍ enviará la copia por correo. }
        '409': { description: CHALLENGE_INVALID o CHALLENGE_EXPIRED (un fallo de validación NO consume el código) }
        '410': { description: ALREADY_SIGNED, LINK_REVOKED o LINK_EXPIRED }
        '413': { description: La foto supera 8 MB }
        '422': { description: ACCEPTANCE_REQUIRED, VALIDATION_ERROR, PHOTO_REQUIRED, PHOTO_INVALID o PHOTO_TOO_SMALL }
        '503': { description: STORAGE_NOT_CONFIGURED (falta SECRETS_KEY) }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
  parameters:
    id: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
  schemas:
    CreateRequest:
      type: object
      required: [documentType, externalRef, signer, data, otp, delivery]
      properties:
        documentType:
          type: string
          example: APPOINTMENT_LETTER
          description: Código del tipo de documento (catálogo `document_types`).
        externalRef: { type: string, description: ID de la solicitud o del cliente en el host. }
        signer:
          type: object
          required: [name, documentType, documentNumber]
          properties:
            name: { type: string }
            documentType: { type: string, example: DNI, description: Tipo del documento de identidad. }
            documentNumber: { type: string }
        data:
          type: object
          description: |
            Datos propios del tipo de documento, validados contra el esquema de su plantilla.
            Para APPOINTMENT_LETTER: `{ "insurances": ["Seguro A", "Seguro B"] }` (las líneas
            A, B, C del modelo, no números de póliza).
        otp:
          type: object
          properties:
            channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
            to: { type: string }
          description: Obligatorio si la política del tipo exige OTP.
        delivery:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [SERVICE, HOST] }
            channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
            to: { type: string, description: Solo con mode=SERVICE. }
        expiresInHours: { type: integer, default: 48 }
        webhookUrl: { type: string, description: Si se omite, se usa el del tenant. }
    SignatureRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        documentType: { type: string }
        reference: { type: string }
        status: { type: string, enum: [PENDING, SIGNED, REJECTED, EXPIRED, REVOKED] }
        signUrl: { type: string, description: Solo con delivery.mode=HOST, en la creación. }
        expiresAt: { type: string, format: date-time }
        signedAt: { type: string, format: date-time, nullable: true }
    SigningView:
      type: object
      properties:
        reference: { type: string }
        documentType: { type: string }
        signerName: { type: string }
        content: { type: object, description: Contenido del documento a mostrar. }
        formSchema: { type: object, description: Campos que el firmante debe completar. }
        policy:
          type: object
          properties:
            photoRequired: { type: boolean }
            photoChallengeRequired: { type: boolean }
        clauseVersion: { type: string }
        clauseText: { type: string }
        sessionToken: { type: string }
  webhooks:
    signatureEvent:
      post:
        summary: Evento de la solicitud; firmado con HMAC-SHA256 en `X-Signature`
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { type: string, enum: [signature.signed, signature.expired, signature.revoked] }
                  requestId: { type: string }
                  documentType: { type: string }
                  externalRef: { type: string }
                  signedAt: { type: string, format: date-time }
                  pdfSha256: { type: string }
                  documentUrl: { type: string, description: URL firmada de corta vida. }
