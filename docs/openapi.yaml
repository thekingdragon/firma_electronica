openapi: 3.0.3
info:
  title: firma-electronica-service
  version: 0.3.0
  description: |
    Contrato M0 (borrador). Autenticación del host: cabecera `X-Api-Key`.
    Los endpoints `/v1/sign/*` son públicos y se protegen con el token del link + OTP.
    Todos los endpoints responden **429 RATE_LIMITED** (con `Retry-After`) si una IP excede su cupo por
    minuto; una clave de API válida nunca se bloquea por los intentos fallidos de otros.
    Una solicitud de firma (`signature request`) es de un `documentType`; la plantilla activa del
    tenant para ese tipo define el contenido, el formulario y la política de evidencia.
servers:
  - url: http://localhost:4000
paths:
  /v1/health:
    get:
      summary: Estado del servicio y de su base de datos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  database: { type: string, enum: [up] }
        '503': { description: La base de datos no responde }
  /v1/operator/overview:
    get:
      summary: Panel de operador — estado del servicio y totales de todas las corredoras
      description: |
        Credencial propia (`X-Operator-Key` = `OPERATOR_KEY`), distinta de la clave de API de una corredora. Sin
        `OPERATOR_KEY` el panel no existe (404 `OPERATOR_DISABLED`); por defecto tampoco acepta lo que llegue por el túnel
        de Cloudflare (`OPERATOR_ALLOW_REMOTE`).
      security: [{ operatorKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { service: { type: object }, totals: { type: object } } }
        '401': { description: INVALID_OPERATOR_KEY }
        '404': { description: OPERATOR_DISABLED }
        '429': { description: RATE_LIMITED }
  /v1/operator/tenants:
    get:
      summary: Corredoras con sus cifras y alertas
      security: [{ operatorKey: [] }]
      responses:
        '200': { description: OK }
        '401': { description: INVALID_OPERATOR_KEY }
    post:
      summary: Alta de una corredora; la clave de API se devuelve UNA sola vez
      security: [{ operatorKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, legalName, country]
              properties:
                name: { type: string }
                legalName: { type: string }
                country: { type: string, example: PE }
                registryCode: { type: string, nullable: true }
                webhookUrl: { type: string, nullable: true }
      responses:
        '201': { description: Creada (tenant, apiKey, webhookSecret) }
        '401': { description: INVALID_OPERATOR_KEY }
        '422': { description: VALIDATION_ERROR }
  /v1/operator/tenants/{id}/active:
    post:
      summary: Activar o desactivar una corredora (desactivada, su clave de API deja de funcionar)
      security: [{ operatorKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [active], properties: { active: { type: boolean } } }
      responses:
        '200': { description: OK }
        '404': { description: TENANT_NOT_FOUND }
  /v1/operator/tenants/{id}/verify:
    post:
      summary: Verifica las últimas 100 firmas de una corredora (PDF, sello, sello de tiempo y bitácora)
      security: [{ operatorKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: "checked, ok, unsealed y failed[] con los problemas de cada firma" }
        '404': { description: TENANT_NOT_FOUND }
  /v1/me:
    get:
      summary: Quién es el dueño de la clave de API (sirve para validarla)
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  country: { type: string }
                  legalName: { type: string }
        '401': { description: INVALID_API_KEY }
  /v1/requests:
    get:
      summary: Listar las solicitudes del tenant, las más nuevas primero
      security: [{ apiKey: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, SIGNED, REJECTED, EXPIRED, REVOKED] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SignatureRequest' }
        '422': { description: VALIDATION_ERROR (status o limit inválidos) }
    post:
      summary: Crear una solicitud de firma
      security: [{ apiKey: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
          description: |
            Entre 1 y 255 caracteres imprimibles, sin espacios; única por tenant. Repetir la
            petición con la misma clave y el mismo cuerpo devuelve la misma solicitud (y el mismo
            `signUrl`) con 200. La misma clave con otro cuerpo da 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }
        '200':
          description: La solicitud ya existía (repetición con la misma Idempotency-Key y cuerpo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }
        '401': { description: "Clave de API ausente o inválida (code INVALID_API_KEY)" }
        '409': { description: "Idempotency-Key reutilizada con un cuerpo distinto (code IDEMPOTENCY_KEY_REUSED)" }
        '422':
          description: |
            Petición inválida. El cuerpo trae `code` y, si aplica, `issues` por campo. Códigos:
            VALIDATION_ERROR, DOCUMENT_TYPE_UNSUPPORTED, TEMPLATE_NOT_FOUND, OTP_REQUIRED,
            INVALID_CONTACT, INVALID_DELIVERY, INVALID_WEBHOOK_URL, INVALID_IDEMPOTENCY_KEY y
            CHANNEL_NOT_AVAILABLE (SMS/WhatsApp y delivery.mode=SERVICE aún sin proveedor).
  /v1/requests/{id}:
    get:
      summary: Consultar el estado de una solicitud
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }
  /v1/requests/{id}/revoke:
    post:
      summary: Revocar una solicitud pendiente
      description: |
        El enlace deja de abrir y una sesión en curso ya no puede firmar. Solo vale mientras está
        PENDING. Avisa al host con `signature.revoked`.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Revocada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [REVOKED] }
        '404': { description: REQUEST_NOT_FOUND (también si es de otro tenant) }
        '409': { description: NOT_PENDING (con el `status` actual) }
  /v1/requests/{id}/evidence:
    get:
      summary: Todo lo registrado de una firma, para la revisión humana
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '404': { description: REQUEST_NOT_FOUND }
        '409': { description: NOT_SIGNED }
  /v1/requests/{id}/review:
    post:
      summary: Dictamen del corredor sobre la identidad del firmante
      description: |
        Solo sobre una solicitud firmada. Se puede corregir un dictamen anterior; cada cambio queda en la
        bitácora y avisa al host con `signature.reviewed`. No cambia el estado de la firma.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result, reviewedBy]
              properties:
                result: { type: string, enum: [VERIFIED, REJECTED] }
                reviewedBy: { type: string, minLength: 2, maxLength: 100, description: Nombre de quien revisa. }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [VERIFIED, REJECTED] }
                  reviewedAt: { type: string, format: date-time }
        '404': { description: REQUEST_NOT_FOUND }
        '409': { description: NOT_SIGNED }
        '422': { description: VALIDATION_ERROR o INVALID_ENCODING }
  /v1/requests/{id}/document:
    get:
      summary: PDF firmado (bytes)
      description: Solo si la solicitud está firmada (409 NOT_SIGNED si no). 404 si es de otro tenant.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409': { description: La solicitud todavía no está firmada }
  /v1/settings:
    get:
      summary: Ajustes de la corredora
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    put:
      summary: Guardar los ajustes (hoy, el aviso de datos personales)
      description: |
        `privacyNotice` es texto plano (máximo 5000 caracteres). Va al pie de TODOS los correos que envía el servicio
        en nombre de la corredora: código de verificación, enlace de firma y copia firmada. Vacío o `null` lo quita.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '422': { description: VALIDATION_ERROR }
  /v1/templates:
    get:
      summary: Plantillas de documento de la corredora (la versión activa de cada tipo)
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TemplateListItem' } }
  /v1/templates/{documentType}:
    get:
      summary: La versión activa de la plantilla, con la lista de versiones
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/documentType' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetail' }
        '404': { description: TEMPLATE_NOT_FOUND }
    post:
      summary: Publicar una versión NUEVA (queda activa)
      description: |
        Una versión publicada no se edita nunca: las solicitudes ya creadas conservan la suya. Los bloques se
        validan completos (variables, códigos repetidos, tamaños) y los problemas se devuelven con su lugar.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/documentType' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishTemplate' }
      responses:
        '201':
          description: Publicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  version: { type: integer }
                  previousVersion: { type: integer, nullable: true }
        '404': { description: TEMPLATE_NOT_FOUND }
        '422': { description: VALIDATION_ERROR, con `issues` por bloque }
  /v1/templates/{documentType}/versions/{version}:
    get:
      summary: Una versión concreta de la plantilla (para verla o partir de ella)
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/documentType' }
        - { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetail' }
        '404': { description: TEMPLATE_NOT_FOUND }
  /v1/templates/{documentType}/preview:
    post:
      summary: PDF de muestra con lo que se está editando (no guarda nada)
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/documentType' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                blocks: { type: array, items: { $ref: '#/components/schemas/Block' } }
                clauseText: { type: string }
      responses:
        '200':
          description: El PDF de muestra
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '422': { description: VALIDATION_ERROR }
  /v1/requests/{id}/evidence-package:
    get:
      summary: Paquete de evidencia (ZIP) para demostrar la firma sin depender de este servicio
      description: |
        Contiene el PDF sellado, el certificado con que se selló, el sello de tiempo (si lo hay), la bitácora con su cadena
        de huellas, lo registrado de la identidad, las fotos (si no vencieron), un manifiesto con la huella de cada archivo y
        un LEEME con cómo verificarlo. 404 si es de otro tenant; 409 si todavía no está firmada.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: El ZIP
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { description: REQUEST_NOT_FOUND }
        '409': { description: NOT_SIGNED }
  /v1/requests/{id}/id-photo-back:
    get:
      summary: Reverso del documento de identidad (bytes), para la revisión humana
      description: |
        Dato sensible. Misma regla que las otras fotos: 404 PHOTO_NOT_FOUND si el tipo no la exigió o es de otro
        tenant; **410 PHOTO_PURGED** si se borró al vencer el plazo de retención.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: La imagen (image/jpeg o image/png)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /v1/requests/{id}/id-photo:
    get:
      summary: Fotografía del documento de identidad (bytes), para la revisión humana
      description: |
        Dato sensible. Misma regla que la foto de verificación: 404 PHOTO_NOT_FOUND si el tipo no la exigió o es
        de otro tenant; **410 PHOTO_PURGED** si se borró al vencer el plazo de retención.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: La imagen (image/jpeg o image/png)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /v1/requests/{id}/photo:
    get:
      summary: Fotografía de verificación (bytes), para la revisión humana
      description: |
        Dato sensible. 404 PHOTO_NOT_FOUND si el tipo no exigió foto; 404 si es de otro tenant; **410
        PHOTO_PURGED** si se borró al vencer el plazo de retención (quedan sus hash en la evidencia).
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: La imagen (image/jpeg o image/png)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /v1/sign/{token}:
    get:
      summary: Qué ve el firmante ANTES de verificar su código
      description: Solo lo mínimo; nada del contenido ni de los datos del firmante.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference: { type: string }
                  documentType: { type: string }
                  issuer: { type: object, properties: { name: { type: string } } }
                  otpRequired: { type: boolean }
                  otpTo: { type: string, nullable: true, description: Correo enmascarado (a**@dominio). }
                  expiresAt: { type: string, format: date-time }
        '404': { description: LINK_NOT_FOUND }
        '410': { description: ALREADY_SIGNED, LINK_REVOKED o LINK_EXPIRED }
  /v1/sign/{token}/otp:
    post:
      summary: Pedir el envío del OTP al contacto de la solicitud
      description: |
        Solo si la política del tipo exige OTP. Un código nuevo reemplaza al anterior.
        Enfriamiento de 60 s y tope de 5 envíos por hora por solicitud.
      responses:
        '200':
          description: Enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  sentTo: { type: string }
                  cooldownSeconds: { type: integer }
                  devCode: { type: string, description: Solo con ALLOW_DEV_OTP y sin correo configurado. }
        '409': { description: OTP_NOT_REQUIRED o MAIL_NOT_CONFIGURED }
        '429': { description: OTP_COOLDOWN (con retryAfterSeconds) u OTP_RATE_LIMITED }
        '502': { description: MAIL_SEND_FAILED (el detalle técnico NO se muestra al firmante) }
  /v1/sign/{token}/verify:
    post:
      summary: Verificar el OTP y abrir la sesión de firma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, pattern: '^[0-9]{6}$' } }
      responses:
        '200':
          description: Devuelve el documento para mostrar y un token de sesión corto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verified' }
        '401': { description: OTP_INVALID (con attemptsLeft), OTP_EXPIRED u OTP_NOT_REQUESTED }
        '429': { description: OTP_LOCKED tras 5 intentos; hay que pedir un código nuevo }
  /v1/sign/{token}/view:
    get:
      summary: Reabrir el documento con una sesión ya verificada (recarga de página)
      parameters:
        - { in: header, name: X-Session, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningView' }
        '401': { description: SESSION_INVALID }
  /v1/sign/{token}/document:
    get:
      summary: Copia firmada para el firmante (con su sesión)
      parameters:
        - { in: header, name: X-Session, required: true, schema: { type: string } }
      responses:
        '200':
          description: El PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409': { description: NOT_SIGNED }
  /v1/sign/{token}/photo-challenge:
    post:
      summary: Emitir un código aleatorio para la foto (invalida el anterior)
      description: |
        Solo si la política del tipo exige desafío de foto. Requiere sesión verificada. El
        firmante escribe el código en un papel y se fotografía con el papel y su documento.
        Vence a los 10 minutos.
      responses:
        '200':
          description: Código emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string, format: uuid }
                  code: { type: string, example: '4821' }
                  expiresAt: { type: string, format: date-time }
        '429': { description: Demasiados códigos pedidos }
  /v1/sign/{token}/submit:
    post:
      summary: Firmar
      description: |
        `photo`, `idPhoto`, `idPhotoBack` y `challengeId` son obligatorios solo si la política del tipo lo exige.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [accepted]
              properties:
                photo: { type: string, format: binary }
                idPhoto: { type: string, format: binary, description: Foto del documento de identidad (frente), tomada en vivo. }
                idPhotoBack: { type: string, format: binary, description: Foto del reverso del documento de identidad, tomada en vivo. }
                challengeId:
                  type: string
                  format: uuid
                  description: Debe ser el desafío vivo y no estar vencido al recibir la foto.
                accepted: { type: boolean }
                form:
                  type: string
                  description: JSON con lo que el firmante marcó o escribió (carta de nombramiento, facultades y observación).
                clientInfo:
                  type: string
                  description: JSON con zona horaria y datos del navegador.
      parameters:
        - { in: header, name: X-Session, required: true, schema: { type: string } }
      responses:
        '200':
          description: Firmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference: { type: string }
                  signedAt: { type: string, format: date-time }
                  pdfSha256: { type: string }
                  emailed: { type: boolean, description: true solo si el servicio SÍ enviará la copia por correo. }
        '409': { description: CHALLENGE_INVALID o CHALLENGE_EXPIRED (un fallo de validación NO consume el código) }
        '410': { description: ALREADY_SIGNED, LINK_REVOKED o LINK_EXPIRED }
        '413': { description: La foto supera 8 MB }
        '422': { description: ACCEPTANCE_REQUIRED, VALIDATION_ERROR, PHOTO_REQUIRED, PHOTO_INVALID o PHOTO_TOO_SMALL }
        '503': { description: STORAGE_NOT_CONFIGURED (falta SECRETS_KEY) }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
    operatorKey: { type: apiKey, in: header, name: X-Operator-Key }
  parameters:
    id: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    documentType: { in: path, name: documentType, required: true, schema: { type: string, example: APPOINTMENT_LETTER } }
  schemas:
    CreateRequest:
      type: object
      required: [documentType, externalRef, signer, data, otp, delivery]
      properties:
        documentType:
          type: string
          example: APPOINTMENT_LETTER
          description: Código del tipo de documento (catálogo `document_types`).
        externalRef: { type: string, description: ID de la solicitud o del cliente en el host. }
        signer:
          type: object
          required: [name, documentType, documentNumber]
          properties:
            name: { type: string }
            documentType: { type: string, example: DNI, description: Tipo del documento de identidad. }
            documentNumber: { type: string }
        data:
          type: object
          description: |
            Datos propios del tipo de documento, validados contra el esquema de su plantilla.
            Para APPOINTMENT_LETTER: `{ "insurances": ["Seguro A", "Seguro B"] }` (las líneas
            A, B, C del modelo, no números de póliza).
        otp:
          type: object
          properties:
            channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
            to: { type: string }
          description: Obligatorio si la política del tipo exige OTP.
        delivery:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [SERVICE, HOST]
              description: |
                HOST: el host envía el link (se devuelve en `signUrl`). SERVICE: el servicio lo envía por
                correo desde el SMTP del tenant, en la misma transacción que crea la solicitud (si el envío
                falla, no queda creada: 502 MAIL_SEND_FAILED). Sin correo configurado: 409 MAIL_NOT_CONFIGURED.
            channel: { type: string, enum: [EMAIL], description: Solo con mode=SERVICE. SMS y WhatsApp aún no están disponibles. }
            to: { type: string, description: Solo con mode=SERVICE. Dirección de correo. }
        expiresInHours: { type: integer, default: 48 }
        webhookUrl: { type: string, description: Si se omite, se usa el del tenant. }
    SignatureRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        documentType: { type: string }
        reference: { type: string }
        status: { type: string, enum: [PENDING, SIGNED, REJECTED, EXPIRED, REVOKED] }
        signUrl: { type: string, description: Solo con delivery.mode=HOST y mientras la solicitud está PENDING. }
        sentTo: { type: string, description: Solo en la creación con mode=SERVICE. Correo enmascarado al que se envió. }
        warnings:
          type: array
          items: { type: string, enum: [LINK_AND_OTP_SAME_CHANNEL] }
          description: Avisos que no impiden crear la solicitud (el link y el código irían al mismo buzón).
        expiresAt: { type: string, format: date-time }
        signedAt: { type: string, format: date-time, nullable: true }
        externalRef: { type: string, description: Solo al leer (GET). }
        signerName: { type: string, description: Solo al leer (GET). }
        data: { type: object, description: Solo al leer (GET). Datos propios del tipo. }
        createdAt: { type: string, format: date-time, description: Solo al leer (GET). }
        review: { type: string, enum: [VERIFIED, REJECTED], nullable: true, description: Solo al leer (GET). }
        deliveryMode: { type: string, enum: [HOST, SERVICE], description: Solo al leer (GET). }
    Evidence:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string }
        signedAt: { type: string, format: date-time, nullable: true }
        pdfSha256: { type: string, nullable: true }
        signer: { type: object }
        otp: { type: object, nullable: true, description: "{ verifiedAt, attempts }; null si el tipo no exige OTP." }
        photo: { type: object, nullable: true, description: "{ width, height, sha256, receivedAt, deletedAt }; deletedAt si la retención la borró." }
        idPhoto: { type: object, nullable: true, description: "Foto del documento de identidad (frente); misma forma que photo." }
        idPhotoBack: { type: object, nullable: true, description: "Foto del reverso del documento; misma forma que photo." }
        integrity:
          type: object
          description: |
            Verificación de punta a punta que se recalcula al pedir la evidencia: huella del PDF, sello de integridad, sello
            de tiempo y cadena de la bitácora. `ok` exige PDF íntegro, sello válido que cubre todo el archivo y de la llave
            registrada, y cadena sin romper; el sello de tiempo es opcional.
          properties:
            ok: { type: boolean }
            pdfIntact: { type: boolean }
            seal: { type: object }
            timestamp: { type: object }
            chain: { type: object }
            problems: { type: array, items: { type: string } }
        challenge: { type: object, nullable: true, description: "{ code, issuedAt }: el código que debía verse en el papel." }
        form: { type: object, description: Lo que el firmante marcó y escribió. }
        clauseText: { type: string, description: Texto exacto de la cláusula que aceptó. }
        ip: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        clientInfo: { type: object, nullable: true }
        review: { type: object, nullable: true, description: "{ result, reviewedBy, note, reviewedAt }" }
        events: { type: array, items: { type: object }, description: Bitácora, de la más antigua a la más nueva. }
    SigningView:
      type: object
      properties:
        reference: { type: string }
        documentType: { type: string }
        issuer: { type: object, properties: { legalName: { type: string }, registryCode: { type: string, nullable: true } } }
        signer: { type: object, properties: { name: { type: string }, documentType: { type: string }, documentNumber: { type: string } } }
        data: { type: object, description: Datos propios del tipo (en la carta, los seguros nombrados). }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ViewBlock' }
          description: El documento como lista de bloques, con las variables y las listas de datos ya resueltas.
        clause: { type: object, properties: { version: { type: integer }, text: { type: string } } }
        policy:
          type: object
          properties:
            photoRequired: { type: boolean }
            photoChallengeRequired: { type: boolean }
            idPhotoRequired: { type: boolean }
            idPhotoBackRequired: { type: boolean }
            reviewRequired: { type: boolean, description: "Si es true, el firmante recibe su copia solo cuando la corredora verifica su identidad." }
        expiresAt: { type: string, format: date-time }
    Settings:
      type: object
      required: [privacyNotice]
      properties:
        privacyNotice: { type: string, nullable: true, maxLength: 5000 }
    Block:
      type: object
      required: [id, type]
      description: |
        Un bloque del documento. `type` es uno de: issuerHeader, title, heading, paragraph, list, dataList,
        powers, consent, signerBox, signatureStamp, annex, pageBreak. Los textos admiten las variables de `variables`
        (`{{signer.name}}`…); cualquier otra variable se rechaza al publicar. Solo puede haber uno de
        issuerHeader, powers, signerBox y signatureStamp. Los consentimientos (`consent`: casilla propia, obligatoria u
        opcional, con su código) pueden ser varios y se registran por separado en la evidencia (`form.consents`).
      properties:
        id: { type: string }
        type: { type: string }
      additionalProperties: true
    ViewBlock:
      type: object
      required: [id, type]
      description: Un bloque ya resuelto para el firmante (variables completas; `dataList` llega como `list`).
      properties:
        id: { type: string }
        type: { type: string }
      additionalProperties: true
    TemplateListItem:
      type: object
      properties:
        documentType: { type: string }
        name: { type: string }
        activeVersion: { type: integer }
        legalReviewed: { type: boolean }
        updatedAt: { type: string, format: date-time }
        publishedBy: { type: string, nullable: true }
    TemplateDetail:
      type: object
      properties:
        documentType: { type: string }
        name: { type: string }
        version: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        publishedBy: { type: string, nullable: true }
        legalReviewed: { type: boolean }
        legacy: { type: boolean, description: "true si se guardó antes de existir los bloques: los de abajo son los equivalentes." }
        blocks: { type: array, items: { $ref: '#/components/schemas/Block' } }
        clauseText: { type: string }
        policy:
          type: object
          properties:
            otpRequired: { type: boolean }
            photoRequired: { type: boolean }
            photoChallengeRequired: { type: boolean }
            idPhotoRequired: { type: boolean }
            idPhotoBackRequired: { type: boolean }
            reviewRequired: { type: boolean, description: "Si es true, el firmante recibe su copia solo cuando la corredora verifica su identidad." }
        variables: { type: array, items: { type: object, properties: { name: { type: string }, label: { type: string } } } }
        versions: { type: array, items: { type: object } }
    PublishTemplate:
      type: object
      required: [blocks, clauseText, policy, publishedBy]
      properties:
        blocks: { type: array, items: { $ref: '#/components/schemas/Block' } }
        clauseText: { type: string }
        policy:
          type: object
          required: [otpRequired, photoRequired, photoChallengeRequired, idPhotoRequired, idPhotoBackRequired, reviewRequired]
          properties:
            otpRequired: { type: boolean }
            photoRequired: { type: boolean }
            photoChallengeRequired: { type: boolean }
            idPhotoRequired: { type: boolean }
            idPhotoBackRequired: { type: boolean }
            reviewRequired: { type: boolean, description: "Si es true, el firmante recibe su copia solo cuando la corredora verifica su identidad." }
        legalReviewed: { type: boolean, default: false }
        publishedBy: { type: string, description: Quién publica; queda registrado. }
    Verified:
      type: object
      properties:
        sessionToken: { type: string, description: Va en la cabecera X-Session. Vigente 30 min. }
        expiresAt: { type: string, format: date-time }
        view: { $ref: '#/components/schemas/SigningView' }
  webhooks:
    signatureEvent:
      post:
        summary: Aviso de cambio de una solicitud
        description: |
          POST a la URL del tenant (o la de la solicitud). Cabeceras: `X-Webhook-Id` (único y estable entre
          reintentos: deduplique por él), `X-Webhook-Event` y `X-Signature: t=<unix>,v1=<hex>`, donde v1 =
          HMAC-SHA256(secreto, "<t>.<cuerpo exacto>"). Responda 2xx para confirmar; cualquier otra cosa se
          reintenta (30 s, 2 min, 10 min, 30 min, 1 h, 3 h, 6 h, 12 h) y tras el 9.º intento se da por fallido.
          Entrega «al menos una vez» y sin orden garantizado. Detalle y código de verificación en WEBHOOKS.md.
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { type: string, enum: [signature.signed, signature.reviewed, signature.revoked, signature.expired] }
                  id: { type: string, format: uuid }
                  occurredAt: { type: string, format: date-time }
                  data:
                    type: object
                    properties:
                      requestId: { type: string, format: uuid }
                      reference: { type: string }
                      documentType: { type: string }
                      externalRef: { type: string }
                      status: { type: string }
                      signedAt: { type: string, format: date-time, nullable: true }
                      pdfSha256: { type: string, nullable: true }
                      documentPath: { type: string, nullable: true, description: Ruta de la API para bajar el PDF con su clave. }
                      photoPath: { type: string, nullable: true, description: Ruta de la API para bajar la foto con su clave. }
                      idPhotoPath: { type: string, nullable: true, description: Ruta de la API para bajar la foto del documento de identidad. }
                      idPhotoBackPath: { type: string, nullable: true, description: Ruta de la API para bajar el reverso del documento. }
                      review: { type: object, nullable: true }
        responses:
          '200': { description: Recibido }
